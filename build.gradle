plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    id 'org.openapi.generator' version '7.10.0'
}

group = 'ru.clevertec'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    mavenLocal()
}

ext {
    set('springCloudVersion', "2024.0.0")
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'jacoco'
    apply plugin: 'org.openapi.generator'


    group = 'ru.clevertec'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenLocal()
        mavenCentral()
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        implementation 'org.springframework.boot:spring-boot-starter-web'
        implementation 'ru.clevertec:logger-starter:1.0'
        implementation 'ru.clevertec:exception-starter:1.0'
        implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
        implementation 'javax.annotation:javax.annotation-api:1.3.2'
        implementation 'com.google.code.gson:gson:2.11.0'
        implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
        implementation 'io.gsonfire:gson-fire:1.9.0'
        implementation 'org.springdoc:springdoc-openapi-starter-common:2.8.1'
        implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.1'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}


tasks.named('bootJar') {
    mainClass.set("ru.clevertec.NewsServiceApplication")
}